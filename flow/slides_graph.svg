<text x="498" y="713.0" dominant-baseline="central" font-size="13.5" fill="#444441">這一步不能改任何字</text>
<line x1="300.0" y1="740" x2="300.0" y2="760" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="120" y="764" width="360" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
