<rect x="373" y="956" width="18" height="18" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="399" y="965" dominant-baseline="central" font-size="13.5" fill="#444441">程式</text>
