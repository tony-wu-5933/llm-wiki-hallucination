<text x="300.0" y="485.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#3C3489">6 逐頁寫稿（只能引用證據卡）</text>
<line x1="300.0" y1="512" x2="300.0" y2="532" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
