<text x="498" y="789.0" dominant-baseline="central" font-size="13.5" fill="#444441">↻ 超出畫面 → 回 6，只改那頁</text>
<line x1="300.0" y1="816" x2="300.0" y2="836" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="120" y="840" width="360" height="50" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text x="300.0" y="865.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#712B13">11 交件前確認（人）</text>
<text x="120" y="922" font-size="13.5" fill="#444441">每個 ↻ 最多 3 輪；還不通過就停下，交給人決定。</text>
