<text x="300.0" y="333.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#444441">4 覆蓋率關卡</text>
<text x="498" y="333.0" dominant-baseline="central" font-size="13.5" fill="#444441">↻ 某張投影片卡片太少 → 回 1</text>
