<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1026" viewBox="0 0 800 1026" font-family="'Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei','PingFang TC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
