<text x="498" y="627.5" dominant-baseline="central" font-size="13.5" fill="#444441">↻ 只退回出錯的頁 → 回 6，</text>
<text x="498" y="646.5" dominant-baseline="central" font-size="13.5" fill="#444441">   下一輪只審退回的頁</text>
