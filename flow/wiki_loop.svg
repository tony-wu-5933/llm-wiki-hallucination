<svg xmlns="http://www.w3.org/2000/svg" width="800" height="722" viewBox="0 0 800 722" font-family="'Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei','PingFang TC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect width="800" height="722" fill="#ffffff"/>
<text x="400.0" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#2C2C2A">建 Wiki 的 loop（每篇資料跑一次，共 5 篇）</text>
<rect x="120" y="80" width="360" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="300.0" y="105.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#3C3489">1 讀原文（raw/text）</text>
<line x1="300.0" y1="132" x2="300.0" y2="152" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="120" y="156" width="360" height="50" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text x="300.0" y="181.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#712B13">2 討論（人確認）</text>
<text x="498" y="171.5" dominant-baseline="central" font-size="13.5" fill="#444441">AI 報告重點、要改哪些頁、</text>
<text x="498" y="190.5" dominant-baseline="central" font-size="13.5" fill="#444441">和既有頁面的矛盾</text>
<line x1="300.0" y1="208" x2="300.0" y2="228" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="120" y="232" width="360" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="300.0" y="257.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#3C3489">3 寫入 Wiki</text>
<line x1="300.0" y1="284" x2="300.0" y2="304" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="120" y="308" width="360" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="300.0" y="333.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#3C3489">4 寫入者自查（5 條清單）</text>
<text x="498" y="323.5" dominant-baseline="central" font-size="13.5" fill="#444441">從第 2 篇起加入：保留語氣、例子真假、</text>
<text x="498" y="342.5" dominant-baseline="central" font-size="13.5" fill="#444441">誰說的、不推成通則、簡化不走樣</text>
<line x1="300.0" y1="360" x2="300.0" y2="380" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="120" y="384" width="360" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="300.0" y="409.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#444441">5 lint 腳本</text>
<text x="498" y="409.0" dominant-baseline="central" font-size="13.5" fill="#444441">↻ 格式錯誤 → 回 3</text>
<line x1="300.0" y1="436" x2="300.0" y2="456" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="120" y="460" width="360" height="50" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="300.0" y="485.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#72243E">6 AI 審查（另開新對話）</text>
<text x="498" y="485.0" dominant-baseline="central" font-size="13.5" fill="#444441">↻ 不忠於原文、矛盾沒並列 → 回 3</text>
<line x1="300.0" y1="512" x2="300.0" y2="532" stroke="#888780" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="120" y="536" width="360" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="300.0" y="561.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#444441">7 更新 index、log，git commit</text>
<text x="120" y="618" font-size="13.5" fill="#444441">每個 ↻ 最多 3 輪；審查常抓到的錯誤，會加進第 4 步的自查清單（檢查往前移）。</text>
<rect x="40" y="652" width="18" height="18" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="66" y="661" dominant-baseline="central" font-size="13.5" fill="#444441">AI 生成</text>
<rect x="154" y="652" width="18" height="18" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="180" y="661" dominant-baseline="central" font-size="13.5" fill="#444441">AI 審查（另開新對話）</text>
<rect x="373" y="652" width="18" height="18" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="399" y="661" dominant-baseline="central" font-size="13.5" fill="#444441">程式</text>
<rect x="463" y="652" width="18" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text x="489" y="661" dominant-baseline="central" font-size="13.5" fill="#444441">人</text>
